[workspace]
resolver = "2"
members = ["crates/proto", "crates/engine", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
# `realtime`: the WASAPI callback thread joins the MMCSS "Audio" task
# (audio_thread_priority). Without it the thread runs at normal priority with
# one 10 ms period of headroom and the UI/decoder can starve it.
cpal = { version = "0.18", features = ["realtime"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "wav", "pcm", "isomp4", "aac", "ogg", "vorbis"] }
# Lean feature set: no accesskit, no Linux window backends, glow renderer,
# single self-contained exe.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.36"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# opt-level 3, not "z": the interpolation loop runs inside the audio
# callback and wants speed over size.
opt-level = 3
strip = true
lto = true
codegen-units = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2
